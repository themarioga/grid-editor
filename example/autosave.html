<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Grid Editor example - auto save and import/export</title>

    <!-- CSS dependencies -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css">

    <!-- JS dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.6/tinymce.min.js"></script>

    <!-- Grid editor CSS -->
    <link rel="stylesheet" type="text/css" href="../dist/grideditor.css" />
    <!-- Grid editor javascript -->
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>
    <script src="../dist/grideditor.min.js"></script>
    <!-- The text editor is a plugin of its own, loaded after the editor -->
    <script src="../dist/plugins/grideditor.tinymce.min.js"></script>
</head>
<body>
    <!-- Back to the demo index -->
    <div class="container pt-3">
        <a class="link-secondary" href="index.html"><i class="bi bi-arrow-left"></i> All demos</a>
    </div>

<div class="container py-3">
    <h2>Grid Editor example - auto save and import/export</h2>
    <div class="mb-3">
        <button id="exportBtn" class="btn btn-primary">Export layout</button>
        <input type="file" id="importInput" class="btn btn-secondary" accept=".html">
        <button id="resetBtn" class="btn btn-danger">Clear draft</button>
    </div>

    <form id="editorForm">
        <div id="myGrid"></div>
    </form>
</div>
<script>
    const LOCAL_STORAGE_KEY = 'gridEditorLayout';
    const grid = document.getElementById('myGrid');
    let editor = null;

    function initEditor(initialContent = '') {
        grid.innerHTML = initialContent;
        editor = new GridEditor(grid, {
            new_row_layouts: [[12], [6,6], [4,4,4]],
            content_types: ['tinymce']
        });
    }

    function autoSave() {
        localStorage.setItem(LOCAL_STORAGE_KEY, editor.getHtml());
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Restore the previous draft, falling back to whatever markup is in the page
        const saved = localStorage.getItem(LOCAL_STORAGE_KEY);
        initEditor(saved || grid.innerHTML);

        setInterval(autoSave, 5000);

        document.getElementById('exportBtn').addEventListener('click', () => {
            const html = editor.getHtml();
            const blob = new Blob([html], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'layout.html';
            a.click();
            URL.revokeObjectURL(url);
        });

        document.getElementById('importInput').addEventListener('change', function (e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                editor.destroy();
                initEditor(e.target.result);
                autoSave();
            };
            reader.readAsText(file);
        });

        document.getElementById('resetBtn').addEventListener('click', function () {
            localStorage.removeItem(LOCAL_STORAGE_KEY);
            location.reload();
        });
    });
</script>
</body>
</html>
